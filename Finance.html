function injectCSS(){
  if(document.getElementById(STYLE_ID)) return;
  var s=document.createElement("style");s.id=STYLE_ID;s.textContent=CSS;
  (document.head||document.documentElement).appendChild(s);
}

/* =============================== MOUNT =============================== */
function mountImpl(container,opts){
  opts=opts||{};
  if(!container){
    container=document.getElementById("pfs-mount");
    if(!container){container=document.createElement("div");document.body.appendChild(container)}
  }
  var embedded=opts.embedded!==undefined?!!opts.embedded:true;
  var DB_NAME=opts.dbName||"PersonalFinanceKSH";
  var WHATSAPP_NUMBER=opts.whatsapp||"254748949444";
  var WHATSAPP_TEXT=opts.whatsappText||"Hello, I need help with the Personal Finance System.";
  var BACK_URL=opts.backUrl||"";

  injectCSS();
  var root=document.createElement("div");
  root.className="pfs"+(embedded?" pfs-embedded":"");
  root.innerHTML=TEMPLATE.replace(/ id="/g,' id="pfs_');
  container.appendChild(root);

  /* ---------- state ---------- */
  var currentReportData=null,recentCache=[],saving=false,bfOn=true;
  var autoOn=false,folderName="",lastBackup=null,statusMsg=null,bkBusy=false;
  var rev=0,lastAutoRev=0,autoTimer=null,destroyed=false,restoreOk=false;
  var FS=typeof window.showDirectoryPicker==="function";
  var drv={id:"drive",connected:false,auto:false,folderId:"",folderName:"",fileId:"",syncedFileId:"",email:"",last:0,dirty:false},drvBusy=false,drvTimer=null;

  var $=function(id){return root.querySelector("#pfs_"+id)};
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var fmt=function(n){return Number(n||0).toLocaleString()};
  var uid=function(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)};

  /* ---------- IndexedDB ---------- */
  var _db=null;
  function db(){
    if(_db) return Promise.resolve(_db);
    return new Promise(function(res,rej){
      if(!window.indexedDB){rej(new Error("IndexedDB is not available in this browser"));return}
      var r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=function(e){var d=e.target.result;
        if(!d.objectStoreNames.contains("departments")) d.createObjectStore("departments",{keyPath:"id"});
        if(!d.objectStoreNames.contains("transactions")) d.createObjectStore("transactions",{keyPath:"id"});
        if(!d.objectStoreNames.contains("settings")) d.createObjectStore("settings",{keyPath:"id"});};
      r.onsuccess=function(){_db=r.result;_db.onversionchange=function(){_db.close();_db=null};res(_db)};
      r.onerror=function(){rej(r.error)};
      r.onblocked=function(){toast("Close other tabs of this app, then reload")};
    });
  }
  async function idb(store,mode,fn){
    var d=await db();
    return new Promise(function(res,rej){
      var t=d.transaction(store,mode),s=t.objectStore(store),rq=fn(s);
      t.oncomplete=function(){res(rq&&rq.result)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)};
    });
  }
  var getAll=function(s){return idb(s,"readonly",function(o){return o.getAll()})};
  var getRec=function(s,k){return idb(s,"readonly",function(o){return o.get(k)})};
  var putRec=function(s,v){var p=idb(s,"readwrite",function(o){return o.put(v)});if(s!=="settings")p.then(markDirty,function(){});return p};
  var delRec=function(s,k){var p=idb(s,"readwrite",function(o){return o.delete(k)});if(s!=="settings")p.then(markDirty,function(){});return p};

  /* Copy records from the old Church Finance database (read-only, never deleted). */
  function openLegacy(){
    return new Promise(function(res,rej){
      if(!window.indexedDB){res(null);return}
      var created=false,r;
      try{r=indexedDB.open(LEGACY_DB)}catch(e){res(null);return}
      r.onupgradeneeded=function(){created=true;try{r.transaction.abort()}catch(e){}};
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){
        if(created){try{indexedDB.deleteDatabase(LEGACY_DB)}catch(e){}res(null)}else res(null);
      };
      r.onblocked=function(){res(null)};
    });
  }
  function readStore(d,name){
    return new Promise(function(res){
      if(!d.objectStoreNames.contains(name)){res([]);return}

  /* ---------- Period + carry-forward logic ----------
     Opening balance (B/F) is always CALCULATED from all earlier records of the
     business (never stored), so it carries correctly month-to-month and
     year-to-year and can never be counted twice. */
  function period(y,m){
    if(y==="ALL") return {start:null,prefix:null,month:m==="ALL"?null:+m};
    var yy=String(y);
    if(m==="ALL") return {start:yy+"-01-01",prefix:yy,month:null};
    var mm=String(+m+1).padStart(2,"0");
    return {start:yy+"-"+mm+"-01",prefix:yy+"-"+mm,month:null};
  }
  function inPeriod(date,p,m){
    if(p.prefix) return date.startsWith(p.prefix);
    if(p.month!==null) return +date.slice(5,7)-1===p.month;
    return true;
  }
  function summarize(trans,deptId,y,m){
    var p=period(y,m),open=0,inc=0,exp=0;
    trans.forEach(function(t){
      if(deptId!=="ALL"&&t.dept!==deptId) return;
      var net=(t.type==="Income"?1:-1)*Number(t.amount||0);
      if(p.start&&t.date<p.start){if(bfOn) open+=net}
      else if(inPeriod(t.date,p,m)){if(t.type==="Income")inc+=Number(t.amount||0);else exp+=Number(t.amount||0)}
    });
    return {open:open,inc:inc,exp:exp,bal:open+inc-exp};
  }

  /* ---------- Reports (Start -> End, per-business Balance Carry Forward) ---------- */
  function plabel(y,m){return (m==="ALL"?"":monthsArr[m]+" ")+(y==="ALL"?"(all years)":y)}
  function bound(y,m,end){
    if(y==="ALL") return null;
    if(m==="ALL") return y+(end?"-12-31":"-01-01");
    return y+"-"+String(+m+1).padStart(2,"0")+(end?"-31":"-01");
  }
  async function runReport(){
    var sy=$("rsYear").value,sm=$("rsMonth").value,ey=$("reYear").value,em=$("reMonth").value;
    var sd=$("rsDept"),ed=$("reDept");
    var from=bound(sy,sm,false),to=bound(ey,em,true);
    if(from&&to&&from>to){toast("Start must not be after End");return}
    var res=await Promise.all([getAll("transactions"),getAll("departments")]);
    var trans=res[0],depts=res[1];
    var used=new Set(trans.map(function(t){return t.dept}));
    var pool=depts.filter(function(d){return d.active!==false||used.has(d.id)}).sort(function(a,b){return a.name.localeCompare(b.name)});
    var all=sd.value==="ALL"||ed.value==="ALL";
    var pick=all?pool:pool.filter(function(d){return d.id===sd.value||d.id===ed.value});
    var per=pick.map(function(d){return {id:d.id,name:d.name,open:0,inc:0,exp:0,bal:0,txs:[],months:[]}});
    var pm={};per.forEach(function(x){pm[x.id]=x});
    /* Pass 1: each business only sees its own records. Records before Start form that
       business's Balance Carry Forward; records inside Start..End form the period. */
    trans.forEach(function(t){
      var x=pm[t.dept];if(!x)return;
      var a=Number(t.amount||0),net=t.type==="Income"?a:-a;
      if(from&&t.date<from){if(bfOn)x.open+=net;return}
      if(to&&t.date>to)return;
      if(t.type==="Income")x.inc+=a;else x.exp+=a;
      x.txs.push({raw:t.date,created:t.created||0,desc:t.desc||"-",income:t.type==="Income"?a:0,expense:t.type==="Expense"?a:0});
    });
    /* Pass 2: walk month by month; each month's B/F is the previous month's closing balance. */
    per.forEach(function(x){
      x.txs.sort(function(a,b){return a.raw.localeCompare(b.raw)||a.created-b.created});
      var run=x.open,cur=null;
      x.txs.forEach(function(t){
        var ym=t.raw.slice(0,7);
        if(!cur||cur.ym!==ym){cur={ym:ym,label:monthsArr[+ym.slice(5,7)-1]+" "+ym.slice(0,4),open:run,inc:0,exp:0,close:run,rows:[]};x.months.push(cur)}
        run+=t.income-t.expense;cur.inc+=t.income;cur.exp+=t.expense;cur.close=run;
        cur.rows.push({date:t.raw.split("-").reverse().join("/"),desc:t.desc,income:t.income,expense:t.expense,bal:run});
      });
      x.bal=x.open+x.inc-x.exp;
    });
    var sum=function(k){return per.reduce(function(t,x){return t+x[k]},0)};
    var dn=all?"All Businesses":(sd.value===ed.value?per.map(function(x){return x.name}).join(""):per.map(function(x){return x.name}).join(" & "));
    currentReportData={per:per,open:sum("open"),totalInc:sum("inc"),totalExp:sum("exp"),balance:sum("bal"),
      meta:{start:plabel(sy,sm),end:plabel(ey,em),deptName:dn||"No business",year:(sy===ey?sy:sy+"-"+ey).replace(/ALL/g,"All"),bf:bfOn}};
    renderReport();toast("Filtered");
  }

    var row=function(n,o,i,e,b,bold){return '<tr'+(bold?' style="font-weight:bold;background:#f1f5f9"':'')+'><td>'+esc(n)+'</td>'+(bf?'<td>'+fmt(o)+'</td>':'')+'<td>'+fmt(i)+'</td><td style="color:#dc2626">'+fmt(e)+'</td><td style="color:#059669">'+fmt(b)+'</td></tr>'};

  function downloadCSV(){
    if(!currentReportData)return;
    var r=currentReportData,m=r.meta,bf=m.bf,q=function(v){return '"'+String(v).replace(/"/g,'""')+'"'};
    var c="Start,"+q(m.start)+"\nEnd,"+q(m.end)+"\nBusiness,"+q(m.deptName)+"\n\n";
    c+="Business,"+(bf?"Balance Carry Forward,":"")+"Income,Expenses,Closing Balance\n";

    if(r.per.length>1) c+=["OVERALL"].concat(bf?[r.open]:[],[r.totalInc,r.totalExp,r.balance]).join(",")+"\n";
    c+="\nBusiness,Month,Date,Description,Income,Expense,Balance\n";
    r.per.forEach(function(x){
      if(bf&&!x.months.length) c+=[q(x.name),"","","Balance Carry Forward","","",x.open].join(",")+"\n";
      x.months.forEach(function(mo){
        if(bf) c+=[q(x.name),q(mo.label),"","Balance Carry Forward","","",mo.open].join(",")+"\n";
        mo.rows.forEach(function(t){c+=[q(x.name),q(mo.label),t.date,q(t.desc),t.income,t.expense,bf?t.bal:""].join(",")+"\n"});
        c+=[q(x.name),q(mo.label),"",bf?"Closing Balance":"Month Total",mo.inc,mo.exp,bf?mo.close:""].join(",")+"\n";
      });
      c+=[q(x.name),"","",q(x.name+" total"),x.inc,x.exp,bf?x.bal:""].join(",")+"\n";

  /* ----- Restore (merge only: never overwrites or deletes existing records) ----- */
  function validateBackup(obj){
    if(!obj||typeof obj!=="object"||obj.app!==BK_APP)return "This is not a Personal Finance System backup file.";
    if(!obj.data||!Array.isArray(obj.data.departments)||!Array.isArray(obj.data.transactions))return "The backup file is missing its records.";
    if(typeof obj.checksum!=="string"||obj.checksum!==fnv(JSON.stringify(obj.data)))return "The backup file is damaged or was modified (integrity check failed).";
    var i,b,t;
    for(i=0;i<obj.data.departments.length;i++){b=obj.data.departments[i];
      if(!b||typeof b.id!=="string"||!b.id||typeof b.name!=="string"||!b.name.trim())return "The backup contains an invalid business record.";}
    var re=/^\d{4}-\d{2}-\d{2}$/;
    for(i=0;i<obj.data.transactions.length;i++){t=obj.data.transactions[i];
      if(!t||typeof t.id!=="string"||!t.id||typeof t.dept!=="string"||typeof t.date!=="string"||!re.test(t.date)||
         (t.type!=="Income"&&t.type!=="Expense")||typeof t.amount!=="number"||!isFinite(t.amount)||t.amount<0||
         (t.desc!=null&&typeof t.desc!=="string"))return "The backup contains an invalid transaction record.";}
    return "";
  }
  async function planRestore(obj){
    var cur=await Promise.all([getAll("departments"),getAll("transactions")]);
    var ld=cur[0],lt=cur[1];
    var dById=new Map(),dByName=new Map();
    ld.forEach(function(d){dById.set(d.id,d);var k=d.name.toLowerCase(),e=dByName.get(k);if(!e||(e.active===false&&d.active!==false))dByName.set(k,d)});
    var map=new Map(),newD=[],reactD=[],reactSet=new Set(),recCount=0;
    obj.data.departments.forEach(function(b){
      var l=dById.get(b.id)||dByName.get(b.name.trim().toLowerCase());
      if(l){map.set(b.id,l.id);
        if(l.active===false&&b.active!==false&&!reactSet.has(l.id)){reactSet.add(l.id);reactD.push(Object.assign({},l,{active:true}))}}
      else{var nd={id:b.id,name:b.name.trim(),active:b.active!==false};newD.push(nd);map.set(b.id,nd.id);dById.set(nd.id,nd);dByName.set(nd.name.toLowerCase(),nd)}
    });
    var key=function(t,dept){return [t.date,dept,t.type,Number(t.amount),(t.desc||"")].join("|")};
    var lById=new Map(lt.map(function(t){return [t.id,t]}));
    var keys=new Set(lt.map(function(t){return key(t,t.dept)}));
    var newT=[],dup=0,conf=0;
    obj.data.transactions.forEach(function(t){
      var l=lById.get(t.id);
      if(l){if(key(l,l.dept)===key(t,map.get(t.dept)||t.dept))dup++;else conf++;return}
      var dept=map.get(t.dept);
      if(!dept){
        if(dById.has(t.dept))dept=t.dept;
        else{recCount++;var nd2={id:t.dept,name:"Recovered Business "+recCount,active:true};newD.push(nd2);map.set(t.dept,t.dept);dById.set(t.dept,nd2);dept=t.dept}
      }
      var k=key(t,dept);
      if(keys.has(k)){dup++;return}
      keys.add(k);
      var cr=typeof t.created==="number"?t.created:Date.now();
      newT.push({id:t.id,date:t.date,dept:dept,amount:Number(t.amount),type:t.type,desc:t.desc||"",created:cr,ref:t.ref||("TRX-"+cr)});
    });
    return {newD:newD,reactD:reactD,newT:newT,dup:dup,conf:conf};
  }
  async function applyRestore(p){
    var d=await db();
    return new Promise(function(res,rej){
      var t=d.transaction(["departments","transactions"],"readwrite");
      var ds=t.objectStore("departments"),ts=t.objectStore("transactions");
      p.newD.forEach(function(x){ds.add(x)});
      p.reactD.forEach(function(x){ds.put(x)});
      p.newT.forEach(function(x){ts.add(x)});
      t.oncomplete=function(){res()};
      t.onabort=function(){rej(t.error||new Error("Restore was cancelled; no changes were made"))};
      t.onerror=function(){};
    });
  }
  async function handleRestore(file,textIn){
    if(!file&&textIn===undefined)return;
    if(bkBusy)return;
    bkBusy=true;
    try{
      var text,obj;
      if(textIn!==undefined){text=textIn;setStatus("Reading Google Drive backup...","")}
      else{
        if(!file.size){setStatus("Restore failed: the selected file is empty.","err");return}
        if(file.size>300*1024*1024){setStatus("Restore failed: the file is too large (over 300 MB).","err");return}
        setStatus("Reading backup file...","");
        try{text=await file.text()}catch(e){setStatus("Restore failed: the file could not be read.","err");return}
      }
      try{obj=JSON.parse(text)}catch(e){setStatus("Restore failed: the file is not a valid backup (not readable JSON).","err");return}
      text=null;
      var bad=validateBackup(obj);
      if(bad){setStatus("Restore failed: "+bad,"err");return}
      var plan=await planRestore(obj);
      var addT=plan.newT.length,addD=plan.newD.length,react=plan.reactD.length;
      if(!addT&&!addD&&!react){
        setStatus("Nothing to restore: every record in this backup already exists."+(plan.conf?"\n"+plan.conf+" record(s) differ from your current data and were left unchanged.":""),"warn");return}
      var when=obj.created?new Date(obj.created).toLocaleString():"unknown date";
      var okc=await ask("Restore backup from "+when+"? It will add "+addT+" transaction(s) and "+addD+" business(es). Existing records will not be overwritten or deleted.");
      if(!okc){setStatus("Restore cancelled. No changes were made.","warn");return}
      setStatus("Restoring...","");
      await applyRestore(plan);
      markDirty();
      await loadDashboard();if(currentReportData)await runReport();
      var msg="Restore successful.\nAdded "+addT+" transaction(s) and "+addD+" business(es)."+(react?"\nReactivated "+react+" business(es).":"")+
        "\nSkipped "+plan.dup+" duplicate(s)"+(plan.conf?" and left "+plan.conf+" differing record(s) unchanged":"")+".";
      setStatus(msg,"ok");toast("Restore successful");
      restoreOk=true;
    }catch(e){
      setStatus("Restore failed: "+String(e&&e.message||e)+". No changes were made.","err");
    }finally{bkBusy=false}
  }

  /* Finds this account's existing Finance backup folder by ID (tag, or the parent of the Finance backup file); never by name. */

    a.checked=!!drv.auto;$("driveAutoState").textContent="Drive Auto Backup is "+(drv.auto?"ON":"OFF");
    $("driveHelp").textContent="Backs up Finance records to its own Google Drive folder, separate from the POS backup. Needs internet; Finance itself works offline.";
    $("driveConnectBtn").textContent=drv.connected?"RECONNECT GOOGLE DRIVE":"CONNECT GOOGLE DRIVE";
    var i=[];
    if(drv.connected)i.push("Connected"+(drv.email?" as "+drv.email:"")+".");else if(sharedEmail())i.push("Same Google account as the POS: "+sharedEmail()+".");
    if(drv.folderName)i.push("Finance folder: "+drv.folderName+" (permanent).");
    if(drv.last)i.push("Last Drive backup: "+new Date(drv.last).toLocaleString()+".");
    if(drv.dirty&&drv.connected)i.push("Changes waiting to be backed up.");
    $("driveInfo").textContent=i.join(" ");
  }
  async function driveConnect(){
    if(drvBusy)return;drvBusy=true;$("driveConnectBtn").disabled=true;
    try{
      await gdToken(true);
      var em=await gdEmail();if(em){drv.email=em;shareEmail(em)}
      drv.connected=true;await saveDrv();
      if(!drv.folderId){
        var ex=await ensureDriveFolder(false);
        if(ex)toast("Your existing Finance backup folder was found: "+drv.folderName);
      }
      setStatus("Google Drive connected"+(drv.email?" as "+drv.email:"")+"."+(drv.folderId?"\nFinance backup folder: "+drv.folderName+".\nTap DRIVE RESTORE to load your Finance records.":"\nNo Finance backup folder yet; one is created on the first DRIVE BACKUP."),"ok");
    }catch(e){setStatus("Google Drive: "+(e&&e.message||e),"err")}
    finally{drvBusy=false;$("driveConnectBtn").disabled=false;renderDrive()}
  }
  async function driveBackup(interactive){
    if(drvBusy||bkBusy)return;
    if(!drv.connected){if(interactive)setStatus("Connect Google Drive first.","warn");return}
    if(!navigator.onLine){setStatus("Offline: the Google Drive backup will run when the internet is back.","warn");return}
    drvBusy=true;if(interactive)$("driveBackupBtn").disabled=true;
    var startRev=rev;
    try{
      if(interactive)setStatus("Backing up to Google Drive...","");
      var folderId=await ensureDriveFolder(true);
      var file=await gdFindFile(folderId),fileId=file?file.id:"";
      if(fileId&&drv.syncedFileId!==fileId){
        if(!interactive){setStatus("Drive backup is waiting: a Finance backup already exists in the Drive folder that this device has not restored. Tap DRIVE BACKUP or DRIVE RESTORE.","warn");return}
        if(!await ask("A Finance backup already exists in Google Drive and this device has not restored it. Replace it with this device's data? (Use DRIVE RESTORE first to keep that data.)"))return;
      }
      var text=await buildBackup();
      var id=await gdUpload(text,folderId,fileId);
      drv.fileId=id;drv.syncedFileId=id;drv.last=Date.now();if(rev===startRev)drv.dirty=false;await saveDrv();
      setStatus("Google Drive backup successful.\nFolder: "+drv.folderName+" / "+GD.FILE+"\n"+new Date(drv.last).toLocaleString(),"ok");if(interactive)toast("Drive backup successful");
    }catch(e){setStatus("Google Drive backup failed: "+(e&&e.message||e),"err")}
    finally{drvBusy=false;$("driveBackupBtn").disabled=false;renderDrive()}
  }
  async function driveRestore(){
    if(drvBusy||bkBusy)return;
    if(!drv.connected){setStatus("Connect Google Drive first.","warn");return}
    if(!navigator.onLine){setStatus("Restore needs an internet connection.","warn");return}
    drvBusy=true;$("driveRestoreBtn").disabled=true;var text=null,fid="";
    try{
      setStatus("Looking for your Finance backup in Google Drive...","");
      var folderId=await ensureDriveFolder(false);
      if(!folderId){setStatus("No Finance backup folder was found in this Google account.","warn");return}
      var file=await gdFindFile(folderId);
      if(!file){setStatus("The Finance backup folder has no backup file yet.","warn");return}
      fid=file.id;text=await (await gdF(GD.API+"/files/"+encodeURIComponent(fid)+"?alt=media")).text();
    }catch(e){setStatus("Google Drive restore failed: "+(e&&e.message||e),"err");return}
    finally{drvBusy=false;$("driveRestoreBtn").disabled=false}
    restoreOk=false;
    await handleRestore(null,text);          // same validation and merge-only restore as a file restore (rejects POS backups)
    if(restoreOk){drv.fileId=fid;drv.syncedFileId=fid;drv.dirty=false;await saveDrv()}
    renderDrive();
  }
  async function onDriveAuto(){
    var on=$("driveAuto").checked;
    if(on&&!drv.connected){$("driveAuto").checked=false;toast("Connect Google Drive first");return}
    drv.auto=on;await saveDrv();renderDrive();
    if(on){toast("Drive auto backup ON");driveBackup(false)}else{clearTimeout(drvTimer);toast("Drive auto backup OFF")}
  }

  /* ---------- event wiring ---------- */
  function onRootClick(e){
    var n=e.target.closest("[data-t]");
    if(n){if(n.dataset.t==="more")toggleMore();else switchTab(n.dataset.t);return}
    var g=e.target.closest("[data-go]");
    if(g){switchTab(g.dataset.go);return}
    var a=e.target.closest("[data-act]");
    if(a){
      var id=a.dataset.id,act=a.dataset.act;
      if(act==="edit")startEdit(id);
      else if(act==="del")confirmDelete(id);
      else if(act==="rmdept")removeDept(id);
    }
  }
  function onDocClick(e){
    if(!e.target.closest||(!e.target.closest(".pfs-more")&&!e.target.closest('[data-t="more"]')))toggleMore(false);
  }
  function onOnline(){autoBackup(true);if(drv.auto&&drv.connected&&drv.dirty)driveBackup(false)}

  root.addEventListener("click",onRootClick);
  document.addEventListener("click",onDocClick);
  window.addEventListener("online",onOnline);
  $("dashMonth").addEventListener("change",loadDashboard);
  $("dashYear").addEventListener("change",loadDashboard);
  $("deptSearch").addEventListener("input",searchTable);
  $("runReportBtn").addEventListener("click",runReport);
  $("pdfBtn").addEventListener("click",downloadPDF);
  $("csvBtn").addEventListener("click",downloadCSV);
  $("deptMgmtToggle").addEventListener("click",toggleDeptMgmt);
  $("addDeptBtn").addEventListener("click",addNewDept);
  $("saveBtn").addEventListener("click",saveTrx);
  $("cancelEdit").addEventListener("click",resetForm);
  $("bfToggle").addEventListener("change",toggleBF);
  $("autoToggle").addEventListener("change",onAutoToggle);
  $("folderSave").addEventListener("click",saveFolder);
  $("manualBackupBtn").addEventListener("click",manualBackup);
  $("restoreBtn").addEventListener("click",function(){$("restoreFile").value="";$("restoreFile").click()});
  $("driveConnectBtn").addEventListener("click",driveConnect);
  $("driveBackupBtn").addEventListener("click",function(){driveBackup(true)});
  $("driveRestoreBtn").addEventListener("click",driveRestore);
  $("driveAuto").addEventListener("change",onDriveAuto);
  $("restoreFile").addEventListener("change",function(){var f=this.files&&this.files[0];handleRestore(f);this.value=""});

  /* ---------- init ---------- */
  async function init(){
    $("waLink").href=waUrl();
    if(BACK_URL){var bl=$("backLink");bl.href=BACK_URL;bl.style.display="flex"}
    setupUI();
    $("trxDate").valueAsDate=new Date();
    try{
      await db();
      await migrateLegacy();
      await seedPersonal();
      var st=await getRec("settings","bf");bfOn=!st||st.value!==false;
      var au=await getRec("settings","auto");autoOn=!!(au&&au.value===true);
      var fo=await getRec("settings","folder");folderName=(fo&&typeof fo.value==="string")?fo.value:"";
      if(autoOn&&!folderName)autoOn=false;
      var lb=await getRec("settings","lastBackup");lastBackup=lb?lb.value:null;
      var dv=await getRec("settings","drive");if(dv)drv=Object.assign(drv,dv,{id:"drive"});
    }catch(e){
      toast("Storage problem: "+(e&&e.message||e));
    }
    $("bfToggle").checked=bfOn;$("bfState").textContent="B/F is "+(bfOn?"ON":"OFF");
    renderBackupPage();
    try{await loadDashboard()}catch(e){}
    rev=0;lastAutoRev=0;
    if(autoOn)autoBackup(true);
    renderDrive();
  }
  init();

  function destroy(){
    destroyed=true;clearTimeout(autoTimer);clearTimeout(drvTimer);
    root.removeEventListener("click",onRootClick);
    document.removeEventListener("click",onDocClick);
    window.removeEventListener("online",onOnline);
    if(_db){try{_db.close()}catch(e){}_db=null}
    if(root.parentNode)root.parentNode.removeChild(root);
  }
  return {root:root,destroy:destroy,showTab:switchTab,refresh:loadDashboard,version:VERSION};
}

/* ------------------------------ public API ------------------------------ */
var active=null;
var PFS={
  version:VERSION,
  mount:function(container,opts){
    if(active){active.destroy();active=null}
    active=mountImpl(container,opts);
    return active;
  }
};
window.PersonalFinanceSystem=PFS;

function autoMount(){
  if(window.PFS_NO_AUTOMOUNT)return;
  var m=document.getElementById("pfs-mount");
  if(m)PFS.mount(m,{embedded:false,backUrl:(window.top===window)?"index.html":""});   /* inside EKAMBANI the shell provides the Back chevron */
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",autoMount);
else autoMount();
})();
</script>
